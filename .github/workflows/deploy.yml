name: Deploy to Raspberry Pi 5

# ─── Trigger ───────────────────────────────────────────────────────────────
# This workflow is manually triggered only — never auto-deploys.
# To trigger: GitHub UI → Actions → Deploy to Raspberry Pi 5 → Run workflow
# Or: gh workflow run deploy.yml -f environment=production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      restart_service:
        description: "Restart the waste-web systemd service after deploy"
        required: true
        default: true
        type: boolean
      run_tests:
        description: "Run tests on the target device after deploy"
        required: false
        default: false
        type: boolean

# ─── Required Secrets ──────────────────────────────────────────────────────
# Configure these in GitHub → Settings → Secrets and variables → Actions:
#   RPI_HOST        — IP or hostname of the Raspberry Pi 5
#   RPI_USER        — SSH username (e.g. pi)
#   RPI_SSH_KEY     — Private SSH key (Ed25519 recommended)
#   RPI_DEPLOY_PATH — Absolute path on RPi (e.g. /home/pi/bharat-aisoc)

env:
  DEPLOY_PATH: ${{ secrets.RPI_DEPLOY_PATH || '/home/pi/bharat-aisoc' }}

jobs:
  # ─── Pre-deploy checks ─────────────────────────────────────────────────
  pre-deploy:
    name: ✅ Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install ruff>=0.4.0

      - name: Lint check before deploy
        run: ruff check "version one c2s/module" --output-format=github

  # ─── Deploy ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to RPi 5 (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: pre-deploy
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RPI_SSH_KEY }}

      - name: Add RPi to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.RPI_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to Raspberry Pi 5
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.gguf' \
            --exclude='*.pt' \
            --exclude='models/' \
            --exclude='logs/' \
            --exclude='database/*.db' \
            --exclude='reports/' \
            --exclude='_patch_tmp/' \
            --exclude='test C2S/' \
            ./ \
            "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Install/update dependencies on RPi
        run: |
          ssh "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" << 'EOF'
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            
            # Create venv if it doesn't exist
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            
            # Install / update dependencies
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r "version one c2s/module/requirements.txt"
            
            echo "✓ Dependencies updated"
          EOF

      - name: Run tests on RPi (optional)
        if: github.event.inputs.run_tests == 'true'
        run: |
          ssh "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" << 'EOF'
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            .venv/bin/pytest "version one c2s/module/tests/" \
              -m "not hardware and not llm and not slow" \
              --tb=short -q
          EOF

      - name: Restart systemd service
        if: github.event.inputs.restart_service == 'true'
        run: |
          ssh "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" \
            "sudo systemctl restart bharat-aisoc-waste.service && \
             sudo systemctl status bharat-aisoc-waste.service --no-pager"

      - name: Verify deployment
        run: |
          sleep 10  # Wait for service to start
          ssh "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" \
            "curl -sf http://localhost:5000/api/status | python3 -m json.tool"

      - name: Deploy summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ secrets.RPI_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web UI | http://${{ secrets.RPI_HOST }}:5000 |" >> $GITHUB_STEP_SUMMARY

