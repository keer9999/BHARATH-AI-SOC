[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bharat-aisoc-waste-classifier"
version = "1.0.0"
description = "AI-Powered Waste Classification & Disposal Assistant — Bharat AI-SoC Challenge 2026-27 PS2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Bharat AI-SoC PS2 Team" },
]
keywords = [
  "waste-classification",
  "yolov8",
  "edge-ai",
  "raspberry-pi",
  "zynq",
  "llama",
  "computer-vision",
  "iot",
  "arm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "ultralytics>=8.0.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "flask>=3.0.0",
  "pyserial>=3.5",
  "reportlab>=4.0",
  "matplotlib>=3.7.0",
  "Pillow>=10.0.0",
  "streamlit>=1.30.0",
  "plotly>=5.18.0",
  "pandas>=2.1.0",
  "requests>=2.31.0",
  "llama-cpp-python>=0.2.80",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
  "types-requests",
  "types-Pillow",
]
executorch = [
  "executorch>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/keer9999/bharath-ai-soc"
Documentation = "https://github.com/keer9999/bharath-ai-soc/tree/main/docs"
Repository = "https://github.com/keer9999/bharath-ai-soc.git"
Issues = "https://github.com/keer9999/bharath-ai-soc/issues"
Changelog = "https://github.com/keer9999/bharath-ai-soc/blob/main/CHANGELOG.md"

[project.scripts]
waste-web = "src.web_app:main"
waste-desktop = "src.main:main"

# ─── Ruff Configuration ────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "hardware"]
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "*.egg-info",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in default arguments
  "N806",   # variable in function should be lowercase (OpenCV convention uses MAT_SIZE style)
  "RUF012", # mutable class variables (common in Flask)
]
unfixable = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["waste_detector", "llama_engine", "data_fusion", "database", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ─── Pytest Configuration ──────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "version one c2s/module/tests",
  "version one c2s/module",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "--color=yes",
]
markers = [
  "hardware: requires physical hardware (camera, Pico W, etc.)",
  "slow: marks tests as slow (> 5s)",
  "llm: requires Llama model file to be present",
  "integration: integration tests that require external services",
]
filterwarnings = [
  "ignore::DeprecationWarning:ultralytics",
  "ignore::UserWarning:torch",
]

# ─── Coverage Configuration ────────────────────────────────────────────────
[tool.coverage.run]
source = ["version one c2s/module"]
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/models/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

# ─── MyPy Configuration ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
  "_patch_tmp/",
  "test C2S/",
]

